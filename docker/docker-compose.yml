# fusion-runtime on a laptop or any machine without an NVIDIA GPU (Mac, Windows, Linux).
# One container: speech and a small LLM (Qwen 0.5B) on the CPU. For a GPU server,
# use docker-compose.gpu.yml instead.
#
#   cd docker
#   docker compose run --rm fusion key new          # put it in docker/.env as FUSION_ACCEPTED_KEYS=<key>
#   docker compose run --rm fusion models pull       # once: ~1.5 GB into docker/models
#   docker compose up
#
# Then open http://localhost:8000 and click Talk (frun token prints a link with a token).
# Without Docker it's simpler still: pip install fusion-runtime && frun up

services:
  fusion:
    image: ghcr.io/samarthurs18/fusion-runtime:cpu
    # or build it from this checkout: docker compose build
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    env_file:
      - path: .env
        required: false
    environment:
      FUSION_CONFIG: development
    volumes:
      - ./models:/models
      # - ./agent.py:/app/agent.py        # your agent, with FUSION_AGENT=/app/agent.py
    ports:
      - "8000:8000"
    restart: unless-stopped
