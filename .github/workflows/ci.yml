name: Tests

# Only runs the test suite. Building the Docker image and deploying are
# deliberately not here: deploys happen when someone runs `frun deploy`, and
# the image gets its own manual workflow once its Dockerfile is fixed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # pyproject says >=3.11, so every version that allows is tested. Most
      # breakage here isn't our code: it's a compiled wheel (ctranslate2,
      # llama-cpp-python, onnxruntime, torch) not published yet for a new
      # Python, which a user hits as a compiler error on install.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    name: tests (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Torch on PyPI bundles CUDA on Linux — several gigabytes of nvidia-* wheels
      # that filled the runner's disk and that CPU tests never touch.
      - name: Install
        run: |
          pip install torch==2.9.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # Tests that need downloaded models are marked "integration" and skip
      # themselves here; everything else runs against fakes and fixtures.
      - name: Run tests
        run: pytest -q -m "not integration"
