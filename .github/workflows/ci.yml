name: Tests

# Only runs the test suite. Building the Docker image and deploying are
# deliberately not here: deploys happen when someone runs `frun deploy`, and
# the image gets its own manual workflow once its Dockerfile is fixed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Tests that need downloaded models are marked "integration" and skip
      # themselves here; everything else runs against fakes and fixtures.
      - name: Run tests
        run: pytest -q -m "not integration"
