# Asks a first-time contributor to sign the CLA (CLA.md) before their pull request
# can be merged, and records the signature in signatures/cla.json on a branch of
# this repo. One signature covers every later contribution.
#
# A CLA is not needed to accept patches — Apache-2.0 §5 already licenses an inbound
# contribution under the project's own terms. It exists so the project can be offered
# under different terms later, which cannot be done retroactively for code that
# arrived without one.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/SamarthUrs18/fusion-runtime/blob/main/CLA.md
          custom-notsigned-prcomment: |
            Thanks for the pull request. Before it can be merged, please read the
            [CLA](https://github.com/SamarthUrs18/fusion-runtime/blob/main/CLA.md) and sign it by
            replying to this thread with exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you."
          # Maintainers and bots don't get asked.
          allowlist: SamarthUrs18,dependabot[bot],github-actions[bot]
