[build-system]
requires = ["setuptools>=77.0", "wheel"]  # PEP 639: SPDX `license` + `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "fusion-runtime"
version = "0.1.1"
description = "Self-hosted voice agent runtime: speech-to-text, LLM and text-to-speech on your own GPU, with tools"
authors = [{ name = "Samarth Urs", email = "hello@fusion-runtime.dev" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# kokoro-onnx caps at <3.14, so that is where we cap too: a user on 3.14 gets
# "requires a different Python" instead of a resolver error deep in an install.
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    # .env files (already required by pydantic-settings; named here because we use it directly)
    "python-dotenv>=1.0",
    "faster-whisper>=1.1.0",
    "llama-cpp-python>=0.2.80",
    "onnxruntime>=1.18.0",
    # TTS wrapper. KokoroTTS reaches into its internals (tokenizer, session,
    # voices), so stay on the minor version it was tested with.
    "kokoro-onnx>=0.6.1,<0.7",
    # torch/torchaudio MUST stay on the same version — torchaudio's
    # compiled extension is ABI-locked to a specific torch release, and an
    # unconstrained ">=" on both let pip resolve them independently on a
    # fresh install, drifting apart (torch 2.9.1 + torchaudio 2.11.0 in
    # practice) and silently breaking Silero VAD load with an
    # `OSError: ... Symbol not found` that's easy to miss since it's
    # caught and treated as "VAD unavailable" rather than crashing loudly.
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "huggingface-hub>=0.23.0",
    # CLI (`frun`)
    "typer>=0.12",
    # Telemetry: /metrics endpoint and process resource metrics
    "prometheus-client>=0.20",
    "psutil>=5.9",
]

[project.scripts]
frun = "fusion_runtime.cli:main"
fusion-runtime = "fusion_runtime.cli:main"

[project.optional-dependencies]
# GPU builds of torch and llama-cpp-python don't come from PyPI: they live on
# NVIDIA-specific indexes, which an extra can't point at. So this extra holds
# only what PyPI can give, and the README has the two index commands for the
# rest. ("torch[cuda]" and "llama-cpp-python[cuda]" were listed here and quietly
# installed CPU builds, since those extras don't exist.)
cuda = [
    # Capped below 1.30: from there onnxruntime-gpu is built against CUDA 13,
    # while torch pins CUDA 12.8. Installed together, the CUDA provider fails to
    # load ("libcublas.so.13: cannot open shared object file") and onnxruntime
    # falls back to the CPU *silently* — text-to-speech then takes seconds
    # instead of milliseconds on a machine with a GPU sitting idle.
    # Newer CUDA 12 builds exist on Microsoft's own feed, see the README.
    "onnxruntime-gpu>=1.18.0,<1.30",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.6.0",
]
talk = [
    # live mic/speaker client (examples/websocket_client.py, later `frun talk`)
    "sounddevice>=0.4.6",
]
examples = [
    "fusion-runtime[talk]",
]
all = [
    "fusion-runtime[cuda]",
    "fusion-runtime[dev]",
    "fusion-runtime[talk]",
]

[project.urls]
Homepage = "https://fusion-runtime.dev"
Documentation = "https://fusion-runtime.dev/docs"
Repository = "https://github.com/SamarthUrs18/fusion-runtime"
Issues = "https://github.com/SamarthUrs18/fusion-runtime/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fusion_runtime*"]

[tool.setuptools.package-data]
fusion_runtime = ["catalog/*.toml", "web/*.html", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Needs the models downloaded (`frun models pull`); skipped where they aren't, e.g. CI
    "integration: runs the real models end to end",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["fusion_runtime"]

[tool.ruff.lint]
# Deliberately not selected:
#   N   — N818 wants every exception named *Error; the contract's names (Cancelled,
#         Overloaded, RateLimited) read better at a call site and are the public API.
#   T20 — `print` is what the CLI is for.
#   UP  — pyupgrade is a worthwhile pass, but a separate one: it rewrites ~430 type
#         annotations, which would bury every real change in the diff for a week.
select = ["E", "F", "I", "W", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines: the limit guides, it doesn't fail a build
    "B008",   # FastAPI's Depends() in an argument default is the documented pattern
    "SIM105", # contextlib.suppress reads worse than try/except/pass at these sites
    "SIM102", # a nested `if` is often the clearer way to say two separate conditions
    "B027",   # an optional hook on a base class is deliberate, not a missing decorator
    # B904 (`raise ... from e`) fires 22 times and each one is a real if small
    # improvement to tracebacks. Left off the gate so it can be a deliberate pass
    # rather than 22 rushed edits; turn it on when that pass happens.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exporting is what these files are for
# Tests import mid-file to set up state before a module reads it, compare against
# True/False to assert the value rather than truthiness, and assert on bare
# Exception where the point is that *something* fails.
"tests/*" = ["E402", "E712", "B017", "C408"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true