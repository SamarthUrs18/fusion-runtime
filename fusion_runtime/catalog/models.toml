# Models fusion-runtime knows how to download.
#
# Every Hugging Face entry is pinned to a commit, so two machines always get
# identical files. Paths are relative to the model directory
# (fusion_runtime.config.model_dir). File sizes are checked after download.
#
#   stage     stt | llm | tts | vad
#   path      what the config profiles point at (see fusion_runtime/config.py)
#   files     file name in the repo -> size in bytes, saved under local_dir
#   runtime   the engine that runs it (llama_cpp | ctranslate2 | onnx | torch_hub)
#   family    pre/post-processing the file format doesn't describe (whisper, kokoro, silero)
#   languages what it understands or speaks; omitted = many / detected from the file
#   voices    TTS voices included

["whisper-tiny.en"]
stage = "stt"
runtime = "ctranslate2"
family = "whisper"
languages = ["en"]
description = "Whisper tiny, English only"
license = "MIT"
source = "huggingface"
repo = "Systran/faster-whisper-tiny.en"
revision = "0d3d19a32d3338f10357c0889762bd8d64bbdeba"
local_dir = "stt/tiny.en"
path = "stt/tiny.en"
files = { "config.json" = 2317, "model.bin" = 75537502, "tokenizer.json" = 2128466, "vocabulary.txt" = 422309 }

["qwen2.5-0.5b-q4"]
stage = "llm"
runtime = "llama_cpp"
description = "Qwen2.5 0.5B Instruct, Q4_K_M (small, for CPU and 8 GB machines)"
license = "Apache-2.0"
source = "huggingface"
repo = "Qwen/Qwen2.5-0.5B-Instruct-GGUF"
revision = "9217f5db79a29953eb74d5343926648285ec7e67"
local_dir = "llm"
path = "llm/qwen2.5-0.5b-instruct-q4_k_m.gguf"
files = { "qwen2.5-0.5b-instruct-q4_k_m.gguf" = 491400032 }

["qwen2.5-7b-q4"]
