source = "huggingface"
repo = "Qwen/Qwen2.5-7B-Instruct-GGUF"
revision = "bb5d59e06d9551d752d08b292a50eb208b07ab1f"
local_dir = "llm"
path = "llm/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf"
files = { "qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf" = 3993201344, "qwen2.5-7b-instruct-q4_k_m-00002-of-00002.gguf" = 689872288 }

["kokoro-v1.0"]
stage = "tts"
runtime = "onnx"
family = "kokoro"
languages = ["en-us", "en-gb"]
voices = ["af_heart", "af_bella", "am_michael", "bf_emma", "bm_lewis"]
description = "Kokoro 82M v1.0, ONNX fp32, 5 voices"
license = "Apache-2.0"
source = "huggingface"
repo = "onnx-community/Kokoro-82M-v1.0-ONNX"
revision = "1939ad2a8e416c0acfeecc08a694d14ef25f2231"
local_dir = "tts"
path = "tts/onnx/model.onnx"
# kokoro-onnx wants every voice in one file; built from voices/*.bin after download
builds = "voices-v1.0.bin"
files = { "onnx/model.onnx" = 325532232, "voices/af_heart.bin" = 522240, "voices/af_bella.bin" = 522240, "voices/am_michael.bin" = 522240, "voices/bf_emma.bin" = 522240, "voices/bm_lewis.bin" = 522240 }

